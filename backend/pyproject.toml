[project]
name = "a-share-research-os-backend"
version = "0.1.0"
description = "A-Share Research OS backend (engineering foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.19.1",
    "sqlalchemy>=2.0.52",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
