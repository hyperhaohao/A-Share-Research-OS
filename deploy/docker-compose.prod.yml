# Production overlay: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up
version: "3.8"
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    environment:
      - ASRO_AUTH_ENABLED=true
      - ASRO_JWT_SECRET=${ASRO_JWT_SECRET:?set ASRO_JWT_SECRET in .env}
      - ASRO_DATABASE_URL=postgresql+psycopg2://asro:${ASRO_PG_PASSWORD:?set ASRO_PG_PASSWORD}@db:5432/asro
    # P0-05: internal only — no published ports
    ports: []

  scheduler:
    # P0-03: scheduler uses the SAME database as backend
    environment:
      - ASRO_DATABASE_URL=postgresql+psycopg2://asro:${ASRO_PG_PASSWORD:?set ASRO_PG_PASSWORD}@db:5432/asro
    ports: []

  db:
    image: postgres:16-alpine
    # P0-06: production password is mandatory, no default
    environment:
      - POSTGRES_USER=asro
      - POSTGRES_PASSWORD=${ASRO_PG_PASSWORD:?set ASRO_PG_PASSWORD in .env}
      - POSTGRES_DB=asro
    ports: []
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
